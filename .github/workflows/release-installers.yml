name: Release PooyeshZamin installers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-installers.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version already published by the successful builder workflow"
        required: true
        default: "1.0.53"
        type: string

permissions:
  contents: write

concurrency:
  group: pooyeshzamin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version || '1.0.53' }}
    steps:
      - name: Download current release assets from this destination repository
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          }
          tag="v$RELEASE_VERSION"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir -p release-assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets --pattern '*'

      - name: Validate installers and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          version="$RELEASE_VERSION"
          for file in \
            "pooyesh-admin-$version.apk" \
            "pooyesh-patrol-$version.apk" \
            "pooyesh-subscriber-$version.apk" \
            "PooyeshZamin-Admin-Setup-$version.exe" \
            latest.yml SHA256SUMS.txt; do
            test -s "$file" || { echo "Missing or empty release file: $file" >&2; exit 1; }
          done
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.blockmap' | wc -l)" -ge 1
          grep -Eq "^version: *['\"]?$version([ '\"]|$)" latest.yml
          sha256sum --check SHA256SUMS.txt
          echo "Validated release v$version"

      - name: Refresh release assets in the destination repository
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            release-assets/*.apk \
            release-assets/*.exe \
            release-assets/*.blockmap \
            release-assets/latest.yml \
            release-assets/SHA256SUMS.txt \
            --clobber
          echo "Verified and refreshed $tag in $GITHUB_REPOSITORY"
